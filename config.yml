# agents-radar configuration
# Edit this file to customize which repositories are tracked.
# Changes take effect on the next workflow run.

# ── OpenClaw (primary focus project) ─────────────────────────────────────────
# Tracked with a dedicated deep-dive report. Set paginated: true for high-volume repos.

hermes:
  id: hermes
  repo: nousresearch/hermes-agent
  name: Hermes Agent
  paginated: true

# ── OpenClaw peer projects ────────────────────────────────────────────────────
# Tracked alongside OpenClaw for cross-ecosystem comparison.

openclaw_peers:
  - id: openclaw
    repo: openclaw/openclaw
    name: OpenClaw
    paginated: true
  - id: nanobot
    repo: HKUDS/nanobot
    name: NanoBot
  - id: zeroclaw
    repo: zeroclaw-labs/zeroclaw
    name: Zeroclaw
  - id: picoclaw
    repo: sipeed/picoclaw
    name: PicoClaw
  - id: nanoclaw
    repo: qwibitai/nanoclaw
    name: NanoClaw
  - id: nullclaw
    repo: nullclaw/nullclaw
    name: NullClaw
  - id: ironclaw
    repo: nearai/ironclaw
    name: IronClaw
  - id: qwenpaw
    repo: agentscope-ai/QwenPaw
    name: Qwen-Paw

# ── Orange Pi / RKLLM / RKNPU projects ────────────────────────────────────────
# Tracked for embedded AI and NPU-related developments.

embedded_ai_repos:
  - id: orangepi-5
    repo: orangepi-xunlong/orangepi-build
    name: Orange Pi Build System
  - id: rknn-toolkit
    repo: airockchip/rknn-toolkit2
    name: RKNN Toolkit 2
  - id: rknn-model-zoo
    repo: airockchip/rknn_model_zoo
    name: RKNN Model Zoo
  - id: rockchip-mpp
    repo: rockchip-linux/mpp
    name: Media Process Platform (MPP) module
